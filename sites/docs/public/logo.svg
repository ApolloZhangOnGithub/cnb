<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Concept 1: Constellation — three nodes connected, representing tongxue coordination -->
  <!-- Lines connecting nodes -->
  <line x1="20" y1="18" x2="44" y2="18" stroke="#141413" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="18" x2="32" y2="46" stroke="#141413" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="46" x2="20" y2="18" stroke="#141413" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="20" cy="18" r="5" fill="#141413"/>
  <circle cx="44" cy="18" r="5" fill="#141413"/>
  <circle cx="32" cy="46" r="5" fill="#141413"/>
  <!-- Center dot — the board -->
  <circle cx="32" cy="27" r="3" fill="#D97757"/>
</svg>

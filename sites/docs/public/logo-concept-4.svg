<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Concept 4: Hexagonal network — board/grid meets team nodes -->
  <g fill="none" stroke="#141413" stroke-width="1.8" stroke-linecap="round">
    <!-- Hex outline -->
    <polygon points="32,6 54,17 54,39 32,50 10,39 10,17" fill="none"/>
    <!-- Inner connections -->
    <line x1="32" y1="6" x2="32" y2="50"/>
    <line x1="10" y1="17" x2="54" y2="39"/>
    <line x1="54" y1="17" x2="10" y2="39"/>
  </g>
  <!-- Six vertex nodes -->
  <circle cx="32" cy="6" r="3.5" fill="#141413"/>
  <circle cx="54" cy="17" r="3.5" fill="#141413"/>
  <circle cx="54" cy="39" r="3.5" fill="#141413"/>
  <circle cx="32" cy="50" r="3.5" fill="#141413"/>
  <circle cx="10" cy="39" r="3.5" fill="#141413"/>
  <circle cx="10" cy="17" r="3.5" fill="#141413"/>
  <!-- Center — the board -->
  <circle cx="32" cy="28" r="4.5" fill="#D97757"/>
</svg>

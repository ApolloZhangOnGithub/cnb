<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Concept 2: Orbital — overlapping circles like atoms/coordination loops -->
  <ellipse cx="32" cy="32" rx="22" ry="10" fill="none" stroke="#141413" stroke-width="2.2" transform="rotate(0 32 32)"/>
  <ellipse cx="32" cy="32" rx="22" ry="10" fill="none" stroke="#141413" stroke-width="2.2" transform="rotate(60 32 32)"/>
  <ellipse cx="32" cy="32" rx="22" ry="10" fill="none" stroke="#141413" stroke-width="2.2" transform="rotate(120 32 32)"/>
  <!-- Center nucleus -->
  <circle cx="32" cy="32" r="4" fill="#D97757"/>
</svg>

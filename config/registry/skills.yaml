  - name: lark-okr
    display: 飞书 OKR
    category: lark
    install: npm install -g @lark-ai/lark-cli
    desc: 目标与关键结果管理
    cmds:
      - lark-okr

  - name: lark-attendance
    display: 飞书考勤
    category: lark
    install: npm install -g @lark-ai/lark-cli
    desc: 考勤打卡记录查询
    cmds:
      - lark-attendance

  - name: lark-event
    display: 飞书事件订阅
    category: lark
    install: npm install -g @lark-ai/lark-cli
    desc: 实时事件流消费（消息、表情、群成员变更）
    cmds:
      - lark-event

  # ── breadboard / standalone tools ──
  - name: fetch-bilibili
    display: B站下载器
    category: media
    repo: https://github.com/ApolloZhangOnGithub/Breadboard
    path: fetch_bilibili/
    desc: B站视频与字幕下载
    cmds:
      - (python script)

  - name: fetch-youtube
    display: YouTube下载器
    category: media
    repo: https://github.com/ApolloZhangOnGithub/Breadboard
    path: fetch_youtube/
    desc: YouTube 视频与字幕下载
    cmds:
      - (python script)

  - name: subtitle-extraction
    display: 字幕提取
    category: media
    repo: https://github.com/ApolloZhangOnGithub/Breadboard
    path: common/generate_artificial_subtitle/
    desc: Vision/PaddleOCR + Whisper 字幕提取
    cmds:
      - (python script)

  - name: markrun
    display: Markrun
    category: dev
    repo: https://github.com/ApolloZhangOnGithub/Breadboard
    path: Markrun_(language)/
    desc: 参数化 markdown (.mr → .md)
    cmds:
      - (python script)

  - name: disk-optimizer
    display: 磁盘优化
    category: infra
    repo: https://github.com/ApolloZhangOnGithub/disk-optimizer
    desc: 磁盘空间分析与清理
    cmds:
      - (python script)

  # ── Claude Code built-in ──
  - name: init
    display: 项目初始化
    category: builtin
    builtin: true
    desc: 为新项目生成 CLAUDE.md
    cmds:
      - /init

  - name: review
    display: PR 评审
    category: builtin
    builtin: true
    desc: 审查 Pull Request
    cmds:
      - /review

  - name: security-review
    display: 安全审查
    category: builtin
    builtin: true
    desc: 对当前分支变更进行安全审查
    cmds:
      - /security-review

  - name: claude-api
    display: Claude API SDK
    category: builtin
    builtin: true
    desc: 构建与调试 Claude API / Anthropic SDK 应用
    cmds:
      - (built-in skill)

  - name: simplify
    display: 代码审查优化
    category: builtin
    builtin: true
    desc: 审查代码复用性、质量与效率
    cmds:
      - /simplify

  - name: loop
    display: 循环任务
    category: builtin
    builtin: true
    desc: 定时重复执行命令
    cmds:
      - /loop

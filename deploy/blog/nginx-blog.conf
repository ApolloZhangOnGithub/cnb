server {
    listen 80;
    server_name c-n-b.space www.c-n-b.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name c-n-b.space www.c-n-b.space;

    # managed by certbot
    ssl_certificate /etc/letsencrypt/live/c-n-b.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c-n-b.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS — force browsers to always use HTTPS (fixes Alibaba Cloud HTTP ICP block)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /docs/ {
        alias /opt/cnb-docs/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
